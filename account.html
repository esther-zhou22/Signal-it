<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal It - Mon compte</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="logo">SIGNAL IT</a>
        <button id="menu-btn" aria-label="Ouvrir le menu" style="z-index: 2000;">
            <span class="hamburger"></span>
        </button>
        
        <div id="mobile-overlay" class="overlay-hidden">
            <nav class="nav-content">
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="map.html">Carte</a></li>
                    <li><a href="about.html">Qui sommes-nous ?</a></li>
                    <li><a href="account.html">Mon compte</a></li> </ul>
            </nav>
        </div>
    </header>
<main class="container login-container">
        <div class="login-card">
            <h2>Se connecter</h2>
            <p class="login-subtitle">Connectez-vous pour gérer vos signalements et voir vos points.</p>

            <div id="login-message" class="hidden"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="ex: emma.dupont@exemple.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary full-width">Se connecter</button>

                <div class="login-footer">
                    <a href="password.html">Mot de passe oublié ?</a>
                    <span class="divider">•</span>
                    <a href="createAccount.html">Créer un compte</a>
                </div>
            </form>
        </div>
    </main>

    <script src="assets/script.js"></script>
    <script src="assets/account.js"></script>
</body>
</html>
